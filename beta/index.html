<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset='utf-8'>
	<meta name='viewport' content='width=device-width,initial-scale=1,interactive-widget=resizes-content'>

	<title>Unsmurf</title>

	<link rel='icon' type='image/svg' href='./unsmurf.svg'>
	<link rel='stylesheet' href='./build/tailwind.css'>
	<link rel='stylesheet' href='./build/bundle.css'>
	<script>
		if (location.pathname.includes('/beta/')) {
			var _g = Storage.prototype.getItem, _s = Storage.prototype.setItem, _r = Storage.prototype.removeItem;
			Storage.prototype.getItem = function(k) { return _g.call(this, 'beta_' + k); };
			Storage.prototype.setItem = function(k, v) { return _s.call(this, 'beta_' + k, v); };
			Storage.prototype.removeItem = function(k) { return _r.call(this, 'beta_' + k); };
			document.documentElement.classList.add('beta');
		}
	</script>
	<style>.beta h1::after{content:" (Beta)";font-size:.6em;font-weight:400;opacity:.6;margin-left:.5em}</style>
	<script>
		try {
			const settings = JSON.parse(localStorage.getItem('unsmurfSettings') || '{}');
			let isDark = false;
			if (settings.theme === 'dark' || settings.darkMode === true) {
				isDark = true;
			} else if (settings.theme === 'system' || !settings.theme) {
				isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
			}
			if (isDark) {
				document.documentElement.classList.add('dark');
				if (settings.midnightMode) {
					document.documentElement.classList.add('midnight');
				}
			}
		} catch (e) {
			console.error('Failed to initialize theme', e);
		}
	</script>

	<script defer src='./build/bundle.js'></script>
</head>

<body>
</body>

</html>
