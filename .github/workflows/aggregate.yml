name: Aggregate Data

on:
  schedule:
    - cron: '0 */12 * * *' # Runs every 12 hours (midnight and noon UTC)
  workflow_dispatch: # Allows manual trigger

jobs:
  aggregate:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out repository
      - name: Check out repository
        uses: actions/checkout@v4

      # Step 1.5: Check out data branch to .data directory
      - name: Check out data branch
        uses: actions/checkout@v4
        with:
          ref: data
          path: .data

      # Step 2: Set up Node.js and Go
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Step 3: Install JS dependencies and build Go aggregator
      - name: Install dependencies
        run: npm ci --production --loglevel verbose

      - name: Build Go aggregator
        run: go build -o ./bin/unsmurf ./cmd/unsmurf

      # Snapshot initial .data before JS runs so Go nations runs from the same baseline
      - name: Snapshot initial data for Go parity run
        run: |
          mkdir -p "$RUNNER_TEMP/go-nations"
          cp -a .data/static "$RUNNER_TEMP/go-nations/static"

      # Step 4: Run NationStates script (authoritative JS)
      - name: Fetch NationStates Data (JS)
        run: node fetchNationStates.js

      # Snapshot post-nations .data so Go sheets runs against the exact same nation archive and prior conflicts
      - name: Snapshot nations data for Go sheets parity run
        run: |
          mkdir -p "$RUNNER_TEMP/go-sheets"
          cp -a .data/static "$RUNNER_TEMP/go-sheets/static"

      # Step 5: Run Google Sheets script (authoritative JS)
      - name: Fetch Google Sheets Data (JS)
        run: node fetchGoogleSheets.js

      # Step 5.5: Shadow-run Go aggregator side-by-side and verify parity
      - name: Run Go aggregator and verify parity
        continue-on-error: true
        run: |
          set -euo pipefail
          ./bin/unsmurf -data "$RUNNER_TEMP/go-sheets" sheets
          ./bin/unsmurf -data "$RUNNER_TEMP/go-nations" nations

          node --input-type=module -e '
            import fs from "fs";
            import path from "path";
            import zlib from "zlib";

            const jsDir = ".data/static";
            const goSheetsDir = path.join(process.env.RUNNER_TEMP, "go-sheets", "static");
            const goNationsDir = path.join(process.env.RUNNER_TEMP, "go-nations", "static");

            const lines = ["### JS vs Go Parity Check", ""];
            let failed = false;

            for (const name of ["puppetData.tsv", "puppetData.json"]) {
              const a = fs.readFileSync(path.join(jsDir, name));
              const b = fs.readFileSync(path.join(goSheetsDir, name));
              const match = a.equals(b);
              lines.push(`- \`${name}\`: ${match ? "MATCH (byte-for-byte)" : `DIFF (js=${a.length}B, go=${b.length}B)`}`);
              if (!match) {
                console.log(`::warning::Parity mismatch in ${name} (js=${a.length}B, go=${b.length}B)`);
                failed = true;
              }
            }

            const stripTs = (buf) => buf.toString("utf8").split("\n").map((line, i) => {
              if (i === 0 || !line) return line;
              const cols = line.split("\t");
              if (cols.length >= 2) cols[1] = "<ts>";
              return cols.join("\t");
            }).join("\n");
            const cJs = fs.readFileSync(path.join(jsDir, "puppetData.conflicts.tsv"));
            const cGo = fs.readFileSync(path.join(goSheetsDir, "puppetData.conflicts.tsv"));
            const cExact = cJs.equals(cGo);
            const cNorm = stripTs(cJs) === stripTs(cGo);
            lines.push(`- \`puppetData.conflicts.tsv\`: ${cExact ? "MATCH (byte-for-byte)" : cNorm ? "MATCH (normalized timestamps)" : "DIFF"}`);
            if (!cNorm) {
              console.log("::warning::Parity mismatch in puppetData.conflicts.tsv");
              failed = true;
            }

            const diffLines = (label, aText, bText) => {
              const aSet = new Set(aText.split("\n").filter(Boolean));
              const bSet = new Set(bText.split("\n").filter(Boolean));
              let onlyA = 0;
              let onlyB = 0;
              for (const x of aSet) if (!bSet.has(x)) onlyA++;
              for (const x of bSet) if (!aSet.has(x)) onlyB++;
              const exact = aText === bText;
              lines.push(`- \`${label}\`: ${exact ? "MATCH (byte-for-byte)" : `js=${aSet.size}, go=${bSet.size}, only_js=${onlyA}, only_go=${onlyB}`}`);
            };

            for (const name of ["currentNations.txt", "currentWANations.txt"]) {
              diffLines(
                name,
                fs.readFileSync(path.join(jsDir, name), "utf8"),
                fs.readFileSync(path.join(goNationsDir, name), "utf8"),
              );
            }
            diffLines(
              "allNations.txt.br (decompressed)",
              zlib.brotliDecompressSync(fs.readFileSync(path.join(jsDir, "allNations.txt.br"))).toString("utf8"),
              zlib.brotliDecompressSync(fs.readFileSync(path.join(goNationsDir, "allNations.txt.br"))).toString("utf8"),
            );

            for (const base of ["currentNations", "currentWANations"]) {
              const txtLines = fs.readFileSync(path.join(goNationsDir, `${base}.txt`), "utf8").split("\n");
              const jsonRaw = fs.readFileSync(path.join(goNationsDir, `${base}.json`), "utf8");
              const ok = jsonRaw === JSON.stringify(txtLines);
              lines.push(`- \`${base}.json\` (Go JSON encoding): ${ok ? "MATCH" : "DIFF"}`);
              if (!ok) {
                console.log(`::warning::Go ${base}.json does not match JSON.stringify(${base}.txt)`);
                failed = true;
              }
            }

            const report = lines.join("\n") + "\n";
            console.log(report);
            if (process.env.GITHUB_STEP_SUMMARY) {
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, report);
            }
            if (failed) process.exit(1);
          '

      # Step 6: Deploy to data branch
      - name: Deploy to data branch
        run: |
          cd .data
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git checkout --orphan snapshot
          git add .
          git commit -m "Update data [skip ci]"
          git push origin snapshot:data --force
