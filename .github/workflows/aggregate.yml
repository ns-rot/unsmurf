name: Aggregate Data

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight UTC
  workflow_dispatch: # Allows manual trigger

jobs:
  aggregate:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out repository
      - name: Check out repository
        uses: actions/checkout@v3

      # Step 1.5: Check out data branch to .data directory
      - name: Check out data branch
        uses: actions/checkout@v3
        with:
          ref: data
          path: .data

      # Step 2: Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      # Step 3: Install dependencies
      - name: Install dependencies
        run: npm ci --production --loglevel verbose

      # Step 4: Run NationStates script
      - name: Fetch NationStates Data
        run: node fetchNationStates.js

      # Step 5: Run Google Sheets script
      - name: Fetch Google Sheets Data
        run: node fetchGoogleSheets.js

      # Step 6: Deploy to data branch
      - name: Deploy to data branch
        run: |
          cd .data
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git checkout --orphan snapshot
          git add .
          git commit -m "Update data [skip ci]"
          git push origin snapshot:data --force
